<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Spaces">
  <!-- Spaces — whole machines on one host.

       House style, matching the in-tree packages: 1024 square, a full-bleed
       gradient, and a white stroke glyph on a 24-unit grid scaled 21.333× into
       the middle 512. Keeping to it matters more than being clever: these are
       seen side by side in one list, and the odd one out reads as broken
       rather than distinctive.

       Graphite rather than another saturated field — hosting is purple, fleet
       indigo, desk teal — and this one is about metal. The single green
       element in the base bar is the one piece of colour, because it is the
       one thing this package says that the others do not: a device on the
       host handed to exactly one guest.

       Two cards and a bar, and nothing else. The design constraint is 16px:
       the hub renders this at sixteen pixels in the nav, where window dots and
       content lines are mud. What survives is a silhouette — a window, a
       second one behind it, metal underneath. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B5563"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#g)"/>
  <g transform="translate(256,256) scale(21.333)" fill="none" stroke="#ffffff"
     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- The machine in front, with its title bar. -->
    <rect x="2" y="6" width="14" height="10" rx="2"/>
    <path d="M2 10h14"/>
    <!-- The one behind, drawn as the corner that is actually visible. -->
    <path d="M8 6V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4"/>
    <!-- The host they run on. -->
    <rect x="4" y="19" width="16" height="3" rx="1.2"/>
    <!-- Its lit element: the device one guest has been given. -->
    <rect x="6" y="20" width="3" height="1" rx="0.5" fill="#30d158" stroke="none"/>
  </g>
</svg>
